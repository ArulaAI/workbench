# ==============================================================================
# GHOSTTY-STYLE TMUX CONFIG
# Minimalist, Top-Aligned, Indigo Accent
# ==============================================================================

# -- Visual Philosophy ---------------------------------------------------------
set -g status-position top
set -g status-justify left
set -g status-style bg=default
set -g status-left-length 20
set -g status-right-length 50

# Colors (SPEED Indigo Palette)
set -g pane-active-border-style fg="#818cf8"
set -g pane-border-style fg="#38384e"
set -g message-style bg="#1e1e2e",fg="#e2e2ef"

# -- Status Bar ----------------------------------------------------------------
set -g status-left "#[fg=#818cf8,bold] SPEED #[fg=#38384e]│ "
set -g status-right "#[fg=#8888a4] %H:%M #[fg=#38384e]│ #[fg=#818cf8]#S "

# Window Status (Tab-style)
setw -g window-status-current-format "#[fg=#818cf8,bg=#1e1e2e,bold] #I:#W #[default]"
setw -g window-status-format "#[fg=#8888a4] #I:#W #[default]"

# -- Key Bindings --------------------------------------------------------------
# Prefix is Ctrl-b (standard)
# Hotkey for the sessionizer: Prefix + f
bind-key -r f run-shell "~/.config/tmux/scripts/sessionizer.sh"

# Split panes with - and |
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# -- Behavior ------------------------------------------------------------------
set -g base-index 1           # Start windows at 1
setw -g pane-base-index 1    # Start panes at 1
set -g renumber-windows on    # Renumber when a window is closed
set -g mouse on               # Enable mouse support
set -g detach-on-destroy off  # Don't exit when closing a session
set -s escape-time 0          # Faster command sequences
set -g history-limit 1000000  # Large scrollback
