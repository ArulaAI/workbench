[lua]
extraction = "rules"

[haskell]
extraction = "rules"

[zig]
extraction = "rules"

# ── Schema languages (ast-grep rules via custom grammars) ──
# Full content included in context. Custom grammars in lib/context/data/grammars/.

[prisma]
category = "schema"
extraction = "rules"

[graphql]
category = "schema"
extraction = "rules"

[protobuf]
category = "schema"
extraction = "rules"

# ── Skeleton-only (grammar exists, parse for structure, no defs/refs) ──

[html]
extraction = "rules"

[css]
extraction = "skeleton"

# ── Config languages (override category from default "source") ──

[json]
category = "config"
extraction = "skeleton"

[yaml]
category = "config"
extraction = "skeleton"

[toml]
category = "config"

[ini]
category = "config"

[xml]
category = "config"

[c_sharp]
extraction = "rules"

# Trusted source capabilities. Repository configuration cannot register code.
[source_adapters.rules]
module = "rules"
version = "1"
contract_version = 1
normalized_output_version = 1
kind = "adapter"
conformance = "declaration"
extraction_level = "rules"
fallback = true
diagnostic_codes = ["SEMANTIC_RESOLUTION_UNAVAILABLE", "RULES_AMBIENT_CALL"]
# The rules adapter detects entry points only for languages whose installed
# rule catalog (lib/context/rules/<rules_language>/) declares business anchors
# or entry-point registrations. Every other language it parses has no
# entry-point detection, so G2 reports it as a language gap.
[source_adapters.rules.capability_languages]
entrypoint_detection = ["java", "jsx", "python", "tsx"]
[source_adapters.rules.capabilities]
parsing = "supported"
declaration_extraction = "supported"
entrypoint_detection = "partial"
call_classification = "partial"
callable_resolution = "partial"
overload_resolution = "unsupported"
type_resolution = "unsupported"
relationship_resolution = "partial"
framework_enrichment = "unsupported"
bindings = "partial"
data_access = "unsupported"
rules = "partial"
control_flow = "partial"
outputs = "partial"
runtime_selection = "unsupported"

