# ── Source ownership ──
# A duplicate extension gets an owner only when one is named here; every other
# duplicate stays ambiguous rather than following catalog order.
[extension_owners]
properties = "properties"

[properties]
category = "config"
extraction = "none"

# Path classifiers override a catalog category for one extension.
[path_classifiers.svg_asset]
extensions = ["svg"]
category = "asset"
reason = "visual_asset"

# Java Properties. Spring application configuration and message bundles are
# decoded and parsed here; repository code is never executed.
[source_adapters.java_properties]
kind = "adapter"
module = "java_properties"
decoder = "decode"
version = "1"
contract_version = 1
normalized_output_version = 1
conformance = "declaration"
languages = ["properties"]
detect_any = ['(?:^|\n)SPEED_PATH:(?:.*/)?src/(?:main|test)/resources/(?:application(?:-[^/]+)?|(?:.*/)?messages(?:_[^/]+)?)\.properties\Z']
diagnostic_codes = ["JAVA_PROPERTIES_SYNTAX_INVALID"]

[source_adapters.java_properties.capabilities]
parsing = "supported"
declaration_extraction = "supported"
entrypoint_detection = "unsupported"
call_classification = "unsupported"
callable_resolution = "unsupported"
overload_resolution = "unsupported"
type_resolution = "unsupported"
relationship_resolution = "unsupported"
framework_enrichment = "unsupported"
bindings = "supported"
data_access = "unsupported"
rules = "unsupported"
control_flow = "unsupported"
outputs = "unsupported"
runtime_selection = "unsupported"

# Supporting inputs are consumed by named owners and never become semantic
# sources of their own.
[supporting_consumers.package_manifest]
module = "package_manifest"
function = "consume"
version = "1"
capabilities = ["runtime_selection"]
capability_status = "partial"
diagnostic_codes = ["PACKAGE_JSON_INVALID"]

[supporting_consumers.typescript_module_resolution]
module = "typescript_module_resolution"
function = "consume"
version = "1"
capabilities = ["type_resolution"]
capability_status = "partial"
diagnostic_codes = ["TYPESCRIPT_MODULE_RESOLUTION_INVALID"]

# Source dispositions. Patterns fully match repository-relative POSIX paths.
[source_dispositions.application_properties]
path_any = ['(?:.*/)?src/(?:main|test)/resources/application(?:-[^/]+)?\.properties']
language = "properties"
disposition = "analyze"
owner = "java_properties"
required_capabilities = ["parsing", "declaration_extraction", "bindings"]

[source_dispositions.message_properties]
path_any = ['(?:.*/)?src/(?:main|test)/resources/(?:.*/)?messages(?:_[^/]+)?\.properties']
language = "properties"
disposition = "analyze"
owner = "java_properties"
required_capabilities = ["parsing", "declaration_extraction", "bindings"]

[source_dispositions.tool_properties]
path_any = ['(?:.*/)?\.mvn/wrapper/maven-wrapper\.properties', '(?:.*/)?sonar-project\.properties']
language = "properties"
disposition = "ignore"
owner = "tool_configuration"

[source_dispositions.package_manifest]
path_any = ['(?:.*/)?package\.json']
language = "json"
disposition = "supporting"
owner = "package_manifest"
required_capabilities = ["runtime_selection"]

[source_dispositions.typescript_module_resolution]
path_any = ['(?:.*/)?(?:tsconfig|typings)\.json']
language = "json"
disposition = "supporting"
owner = "typescript_module_resolution"
required_capabilities = ["type_resolution"]

[source_dispositions.developer_tool_configuration]
path_any = ['(?:.*/)?\.vscode/.*', '(?:.*/)?tslint\.json']
disposition = "ignore"
owner = "developer_tool_configuration"

[source_dispositions.stylesheet]
path_any = ['.*\.less']
language = "less"
disposition = "ignore"
owner = "stylesheet"

# Files that cannot declare entry points or business behavior and that no
# installed owner consumes: stylesheets, build project metadata, platform
# bundle metadata and dependency lock files. They are out of scope, not
# unsupported, so they are ignored rather than warned about.
[source_dispositions.stylesheet_css]
language = "css"
disposition = "ignore"
owner = "stylesheet"

[source_dispositions.stylesheet_scss]
language = "scss"
disposition = "ignore"
owner = "stylesheet"

[source_dispositions.build_project_metadata]
language = "msbuild"
disposition = "ignore"
owner = "build_project_metadata"

[source_dispositions.platform_bundle_metadata]
path_any = ['.*\.plist']
disposition = "ignore"
owner = "platform_bundle_metadata"

[source_dispositions.dependency_lock]
path_any = ['(?:.*/)?(?:package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.ya?ml|bun\.lockb?|Cargo\.lock|Gemfile\.lock|poetry\.lock|Pipfile\.lock|composer\.lock|packages\.lock\.json|go\.sum|uv\.lock|pdm\.lock|mix\.lock|flake\.lock)']
disposition = "ignore"
owner = "dependency_lock"

[source_dispositions.visual_asset]
category = "asset"
disposition = "ignore"
owner = "asset"

[source_dispositions.ide_launch_configuration]
path_any = ['.*\.launch']
language = "xml"
disposition = "reference_only"
owner = "ide_launch_configuration"

[source_dispositions.logging_configuration]
path_any = ['(?:.*/)?logback\.xml']
language = "xml"
disposition = "reference_only"
owner = "logging_configuration"

[source_dispositions.ci_configuration]
path_any = ['\.github/workflows/.*\.ya?ml', '\.travis\.yml']
disposition = "ignore"
owner = "ci_configuration"

[source_dispositions.speed_configuration]
path_any = ['speed\.toml']
language = "toml"
disposition = "ignore"
owner = "speed_configuration"

# Test, seed and CI SQL scripts exercise or provision a database; they declare
# no production entry points. They are retained as test evidence (see
# catalog.json test_path_pattern) without semantic extraction or dialect
# selection.
[source_dispositions.sql_test_and_provisioning_scripts]
path_any = [
  '(?:.*/)?(?:tests?|__tests__)/.*\.sql',
  '(?:.*/)?seeds?/.*\.sql',
  '(?:.*/)?(?:[^/]*[-_.])?seeds?(?:[-_.][^/]*)?\.sql',
  '\.(?:github|circleci)/.*\.sql',
]
language = "sql"
disposition = "reference_only"
owner = "sql_test_and_provisioning_script"
