[source_adapters.oracle_plsql]
kind = "adapter"
module = "sql"
version = "1"
parser = "sqlglot"
parser_version = "30.18.0"
parser_dialect = "oracle"
contract_version = 1
normalized_output_version = 1
conformance = "semantic"
languages = ["sql"]
dialects = ["oracle_plsql"]
supported_versions = ["Oracle Database 19c"]
recognized_extensions = [".sql"]
detect_any = [
  '(?im)^\s*CREATE\s+(?:OR\s+REPLACE\s+)?PACKAGE\s+(?:BODY\s+)?\w+',
  '(?ims)^\s*CREATE\s+(?:OR\s+REPLACE\s+)?(?:PROCEDURE|FUNCTION)\s+\w+[^;]*?\b(?:IS|AS)\s+(?:BEGIN|\w+\s+(?:NUMBER|VARCHAR2))',
  '(?ims)^\s*CREATE\s+(?:OR\s+REPLACE\s+)?TRIGGER\s+\w+.*?(?::(?:NEW|OLD)\b|\b(?:NUMBER|VARCHAR2|PLS_INTEGER)\b|END(?:\s+\w+)?\s*;\s*/)',
  '(?i)\bPRAGMA\s+AUTONOMOUS_TRANSACTION\b',
  '(?i)\bVARCHAR2\s*(?:\(|\b)',
  '(?i)\b\w+(?:\.\w+)?%(?:TYPE|ROWTYPE)\b',
]
exclude_any = ['(?i)\bLANGUAGE\s+plpgsql\b']
diagnostic_codes = ["PARTIAL_DIALECT_PARSER", "SQL_MATERIAL_PARSE_ERROR", "SQL_CALL_UNRESOLVED", "SQL_CALL_AMBIGUOUS", "SQL_DYNAMIC_CALL", "SQL_EXTERNAL_PACKAGE_CALL", "SQL_DATA_TARGET_UNRESOLVED", "SQL_OPERATION_PARSE_GAP", "SQL_CONTROL_FLOW_UNRESOLVED", "SQL_CHANGED_VALUES_UNRESOLVED", "SQL_TRANSACTION_SCOPE_UNRESOLVED", "SQL_COMMIT_NOT_ESTABLISHED", "SQL_COMPLETION_UNRESOLVED"]
