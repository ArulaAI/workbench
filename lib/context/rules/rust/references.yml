id: rust-field-access
language: rust
metadata:
  produces: reference
  ref_kind: attribute_access
rule:
  kind: field_expression

---
id: rust-use
language: rust
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
rule:
  kind: use_declaration
  pattern: use $MODULE;

---
id: rust-call
language: rust
metadata:
  produces: reference
  ref_kind: call
  name_var: FUNC
rule:
  kind: call_expression
  pattern: $FUNC($$$ARGS)
