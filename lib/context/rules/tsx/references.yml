id: tsx-member-expression
language: tsx
metadata:
  produces: reference
  ref_kind: attribute_access
rule:
  kind: member_expression

---
id: tsx-import-named
language: tsx
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
  symbols_var: NAMES
rule:
  kind: import_statement
  pattern: import { $$$NAMES } from $MODULE

---
id: tsx-import-default
language: tsx
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
rule:
  kind: import_statement
  pattern: import $NAME from $MODULE

---
id: tsx-import-namespace
language: tsx
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
rule:
  kind: import_statement
  pattern: import * as $NAME from $MODULE

---
id: tsx-import-type
language: tsx
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
  symbols_var: NAMES
rule:
  kind: import_statement
  pattern: import type { $$$NAMES } from $MODULE

---
id: tsx-require
language: tsx
metadata:
  produces: reference
  ref_kind: import
  module_var: MODULE
rule:
  kind: call_expression
  pattern: require($MODULE)

---
id: tsx-call
language: tsx
metadata:
  produces: reference
  ref_kind: call
  name_var: FUNC
rule:
  kind: call_expression
  pattern: $FUNC($$$ARGS)
