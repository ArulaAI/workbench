<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#2a2a2e"/>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dimmed Global Graph -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="4" fill="#888890"/>
    <circle cx="200" cy="80" r="4" fill="#888890"/>
    <circle cx="150" cy="200" r="4" fill="#888890"/>
    <circle cx="300" cy="150" r="4" fill="#888890"/>
    <circle cx="450" cy="80" r="4" fill="#888890"/>
    <circle cx="500" cy="250" r="4" fill="#888890"/>
    <path d="M 100 100 L 200 80 M 200 80 L 300 150 M 150 200 L 300 150 M 300 150 L 450 80 M 450 80 L 500 250" stroke="#888890" stroke-width="1"/>
  </g>

  <!-- FOCUS RING -->
  <circle cx="300" cy="200" r="120" stroke="#00ccaa" stroke-width="2" stroke-dasharray="8 4" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="70" fill="#00ccaa" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">JUST-IN-TIME SCOPING</text>

  <!-- Active Nodes (1-hop) -->
  <g filter="url(#glow)">
    <circle cx="300" cy="200" r="8" fill="#00ccaa"/> <!-- Entrypoint -->
    <text x="300" y="225" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Task Entrypoint (File A)</text>

    <circle cx="220" cy="180" r="6" fill="#00ccaa" opacity="0.8"/>
    <circle cx="380" cy="180" r="6" fill="#00ccaa" opacity="0.8"/>
    <circle cx="300" cy="280" r="6" fill="#00ccaa" opacity="0.8"/>

    <path d="M 300 200 L 220 180 M 300 200 L 380 180 M 300 200 L 300 280" stroke="#00ccaa" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Skeleton Nodes (2-hop) -->
  <g opacity="0.5">
    <circle cx="160" cy="140" r="5" stroke="#ffcc33" stroke-width="2" fill="none"/>
    <circle cx="440" cy="140" r="5" stroke="#ffcc33" stroke-width="2" fill="none"/>
    <circle cx="420" cy="260" r="5" stroke="#ffcc33" stroke-width="2" fill="none"/>
    <path d="M 220 180 L 160 140 M 380 180 L 440 140 M 380 180 L 420 260" stroke="#ffcc33" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Legend -->
  <g transform="translate(420, 310)">
    <rect width="160" height="70" rx="8" fill="#363638" stroke="#888890" stroke-opacity="0.3"/>
    <circle cx="20" cy="20" r="5" fill="#00ccaa"/>
    <text x="35" y="24" fill="#a0a0a8" font-family="Inter, sans-serif" font-size="9">Full Content (1-hop)</text>

    <circle cx="20" cy="40" r="4" stroke="#ffcc33" stroke-width="1.5" fill="none"/>
    <text x="35" y="44" fill="#a0a0a8" font-family="Inter, sans-serif" font-size="9">Skeletons (2-hop)</text>

    <path d="M 12 55 H 28" stroke="#888890" stroke-width="1" opacity="0.4"/>
    <text x="35" y="59" fill="#a0a0a8" font-family="Inter, sans-serif" font-size="9">Pruned from budget</text>
  </g>
</svg>
