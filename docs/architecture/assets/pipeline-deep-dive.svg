<?xml version="1.0" encoding="UTF-8"?>
<svg width="840" height="660" viewBox="0 0 840 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="840" height="660" fill="#2a2a2e"/>
  
  <defs>
    <linearGradient id="box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccaa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ccaa" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ccaa" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Top Inputs -->
  <g transform="translate(340, 20)">
    <text x="0" y="0" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">CODEBASE</text>
    <path d="M 0 10 V 45" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.6"/>
  </g>
  <g transform="translate(560, 20)">
    <text x="0" y="0" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">SPEC FILES</text>
    <path d="M 0 10 V 45" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.6"/>
  </g>

  <!-- LAYER 1 BOX -->
  <rect x="50" y="70" width="740" height="210" rx="16" fill="url(#box-grad)" stroke="#00ccaa" stroke-opacity="0.2"/>
  <text x="420" y="105" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" text-anchor="middle">LAYER 1 — INDEX</text>
  <text x="420" y="125" fill="#68686e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Built once at pipeline start · Deterministic · tree-sitter + networkx</text>

  <!-- L1 Sub-boxes -->
  <g transform="translate(80, 155)">
    <rect width="170" height="65" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="85" y="28" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Project Map</text>
    <text x="85" y="44" fill="#68686e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">files, languages, lines</text>
  </g>

  <g transform="translate(265, 150)">
    <rect width="310" height="75" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="155" y="32" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Codebase Semantic Graph</text>
    <text x="155" y="50" fill="#68686e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">symbols &#8594; references &#8594; clusters &#8594; impact</text>
  </g>

  <g transform="translate(590, 155)">
    <rect width="170" height="65" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="85" y="28" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Skeletons</text>
    <text x="85" y="44" fill="#68686e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">10:1 compression</text>
  </g>

  <g transform="translate(265, 240)">
    <rect width="310" height="50" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="155" y="25" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spec-Codebase Alignment</text>
    <text x="155" y="40" fill="#68686e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">confirmed · missing · divergent</text>
  </g>

  <!-- Connectors L1 to L2 -->
  <path d="M 180 280 L 160 340" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>
  <path d="M 420 280 L 420 340" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>
  <path d="M 610 280 L 630 340" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>

  <!-- LAYER 2 -->
  <text x="50" y="320" fill="#ffcc33" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">LAYER 2</text>
  <line x1="110" y1="316" x2="680" y2="316" stroke="#00ccaa" opacity="0.3"/>
  <text x="690" y="320" fill="#68686e" font-family="Inter, sans-serif" font-size="10">per-task · just-in-time · ~500 ms</text>

  <!-- Task Columns -->
  <g transform="translate(68, 345)">
    <rect width="170" height="150" rx="12" fill="#42424a" font-family="IBM Plex Mono, monospace" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="85" y="25" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">Task 1</text>
    <rect x="15" y="40" width="140" height="25" rx="4" fill="#2a2a2e" opacity="0.5"/>
    <text x="20" y="56" fill="#68686e" font-family="Inter, sans-serif" font-size="9">code ctx</text>
    <text x="150" y="56" fill="#a0a0a8" font-family="Inter, sans-serif" font-size="9" text-anchor="end">full + skeleton</text>
    <rect x="15" y="70" width="140" height="25" rx="4" fill="#2a2a2e" opacity="0.5"/>
    <text x="20" y="86" fill="#68686e" font-family="Inter, sans-serif" font-size="9">task ctx</text>
    <rect x="15" y="100" width="140" height="25" rx="4" fill="#2a2a2e" opacity="0.5"/>
    <text x="20" y="116" fill="#68686e" font-family="Inter, sans-serif" font-size="9">spec ctx</text>
    <text x="85" y="140" fill="#68686e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">budget.json &#8212; cut recording</text>
  </g>

  <g transform="translate(335, 345)">
    <rect width="170" height="150" rx="12" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="85" y="25" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">Task 2</text>
  </g>

  <g transform="translate(602, 345)">
    <rect width="170" height="150" rx="12" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="85" y="25" fill="#f0f0f0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">Task N</text>
    <text x="85" y="140" fill="#68686e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">.speed/features/*</text>
  </g>

  <!-- Connectors L2 to L3 -->
  <path d="M 153 495 V 560" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>
  <path d="M 420 495 V 560" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>
  <path d="M 687 495 V 560" stroke="#00ccaa" stroke-width="1.5" marker-end="url(#arrow-indigo)" opacity="0.3"/>

  <!-- LAYER 3 -->
  <text x="50" y="530" fill="#44bbee" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">LAYER 3</text>
  <line x1="110" y1="526" x2="630" y2="526" stroke="#00ccaa" opacity="0.3"/>
  <text x="640" y="530" fill="#68686e" font-family="Inter, sans-serif" font-size="10">one assembly function per stage · ~10 ms</text>

  <!-- Assembly Boxes -->
  <g transform="translate(60, 560)">
    <rect width="186" height="65" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="93" y="30" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">assemble_developer()</text>
    <text x="93" y="46" fill="#68686e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">context &#8594; content &#8594; intent</text>
  </g>

  <g transform="translate(327, 560)">
    <rect width="186" height="65" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="93" y="30" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">assemble_developer()</text>
  </g>

  <g transform="translate(594, 560)">
    <rect width="186" height="65" rx="8" fill="#42424a" stroke="#00ccaa" stroke-opacity="0.5"/>
    <text x="93" y="30" fill="#f0f0f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">assemble_reviewer()</text>
    <text x="93" y="46" fill="#68686e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">criteria + diff + impact</text>
  </g>

  <!-- Side Annotation -->
  <path d="M 800 150 Q 830 150 830 400 T 800 650" stroke="#a0a0a8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <text transform="translate(835, 400) rotate(90)" fill="#a0a0a8" font-family="Inter, sans-serif" font-size="10" opacity="0.6" text-anchor="middle">Architect + Plan Verifier bypass</text>
</svg>
