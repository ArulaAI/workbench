<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" fill="none">
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  </style>

  <defs>
    <symbol id="human" viewBox="0 0 16 16">
      <circle cx="8" cy="4.5" r="3" fill="#e8a87c"/>
      <path d="M 2,15 C 2,10.5 5,9 8,9 C 11,9 14,10.5 14,15" fill="#e8a87c"/>
    </symbol>
  </defs>

  <!-- ═══ TIMELINE SPINE ═══ -->
  <line x1="80" y1="140" x2="840" y2="140"
        stroke="#58585e" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Phase labels on spine -->
  <text x="130" y="130" text-anchor="middle"
        class="mono" font-size="9" fill="#e8a87c" fill-opacity="0.6"
        letter-spacing="0.04em">DEFINE</text>
  <text x="390" y="130" text-anchor="middle"
        class="mono" font-size="9" fill="#00ccaa" fill-opacity="0.5"
        letter-spacing="0.04em">EXECUTE</text>
  <text x="610" y="130" text-anchor="middle"
        class="mono" font-size="9" fill="#e8a87c" fill-opacity="0.6"
        letter-spacing="0.04em">JUDGE</text>
  <text x="790" y="130" text-anchor="middle"
        class="mono" font-size="9" fill="#00ccaa" fill-opacity="0.5"
        letter-spacing="0.04em">LEARN</text>

  <!-- Phase dots on spine -->
  <circle cx="80" cy="140" r="5" fill="#303034" stroke="#e8a87c" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="240" cy="140" r="5" fill="#303034" stroke="#58585e" stroke-width="1.5"/>
  <circle cx="540" cy="140" r="5" fill="#303034" stroke="#58585e" stroke-width="1.5"/>
  <circle cx="690" cy="140" r="5" fill="#303034" stroke="#58585e" stroke-width="1.5"/>
  <circle cx="840" cy="140" r="5" fill="#303034" stroke="#58585e" stroke-width="1.5"/>

  <!-- System phase fill (between dots) -->
  <rect x="240" y="137" width="300" height="6" rx="3"
        fill="#00ccaa" fill-opacity="0.08"/>
  <rect x="690" y="137" width="150" height="6" rx="3"
        fill="#00ccaa" fill-opacity="0.08"/>

  <!-- ═══ CEREMONY 1: SPEC SESSION ═══ -->
  <!-- Connector from spine to card -->
  <line x1="160" y1="140" x2="160" y2="168"
        stroke="#e8a87c" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="160" cy="140" r="8" fill="#e8a87c" fill-opacity="0.15"
          stroke="#e8a87c" stroke-width="1.5" stroke-opacity="0.6"/>
  <use href="#human" x="152" y="132" width="16" height="16"/>

  <!-- Card -->
  <rect x="40" y="170" width="240" height="130" rx="8"
        fill="#303034" stroke="#e8a87c" stroke-width="1" stroke-opacity="0.35"/>

  <text x="60" y="196"
        class="mono" font-size="12" font-weight="700" fill="#e8a87c"
        letter-spacing="0.03em">SPEC SESSION</text>
  <text x="60" y="214" font-size="10" fill="#58585e">Before Execute</text>

  <line x1="60" y1="224" x2="260" y2="224"
        stroke="#58585e" stroke-width="0.5" stroke-opacity="0.2"/>

  <text x="60" y="244" font-size="10" fill="#b8b8be">Write the specification together.</text>
  <text x="60" y="260" font-size="10" fill="#b8b8be">Acceptance criteria, data contracts,</text>
  <text x="60" y="276" font-size="10" fill="#b8b8be">scope boundaries.</text>

  <text x="60" y="294" font-size="9" fill="#58585e" font-style="italic">
    Replaces: planning, grooming, estimation</text>

  <!-- ═══ CEREMONY 2: OUTCOME REVIEW ═══ -->
  <!-- Connector -->
  <line x1="540" y1="140" x2="540" y2="28"
        stroke="#e8a87c" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="540" cy="140" r="8" fill="#e8a87c" fill-opacity="0.15"
          stroke="#e8a87c" stroke-width="1.5" stroke-opacity="0.6"/>
  <use href="#human" x="532" y="132" width="16" height="16"/>

  <!-- Card (above timeline) -->
  <rect x="420" y="6" width="240" height="120" rx="8"
        fill="#303034" stroke="#e8a87c" stroke-width="1" stroke-opacity="0.35"/>

  <text x="440" y="32"
        class="mono" font-size="12" font-weight="700" fill="#e8a87c"
        letter-spacing="0.03em">OUTCOME REVIEW</text>
  <text x="440" y="50" font-size="10" fill="#58585e">After Execute</text>

  <line x1="440" y1="60" x2="640" y2="60"
        stroke="#58585e" stroke-width="0.5" stroke-opacity="0.2"/>

  <text x="440" y="80" font-size="10" fill="#b8b8be">Judge results against evidence.</text>
  <text x="440" y="96" font-size="10" fill="#b8b8be">Pass/fail/unverifiable per criterion.</text>
  <text x="440" y="112" font-size="10" fill="#b8b8be">No walkthrough. Verdict only.</text>

  <!-- Replaces label - inside card -->

  <!-- ═══ CEREMONY 3: LEARNING CURATION ═══ -->
  <!-- Connector -->
  <line x1="790" y1="140" x2="790" y2="168"
        stroke="#e8a87c" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="790" cy="140" r="8" fill="#e8a87c" fill-opacity="0.15"
          stroke="#e8a87c" stroke-width="1.5" stroke-opacity="0.6"/>
  <use href="#human" x="782" y="132" width="16" height="16"/>

  <!-- Card -->
  <rect x="670" y="170" width="240" height="130" rx="8"
        fill="#303034" stroke="#e8a87c" stroke-width="1" stroke-opacity="0.35"/>

  <text x="690" y="196"
        class="mono" font-size="12" font-weight="700" fill="#e8a87c"
        letter-spacing="0.03em">LEARNING CURATION</text>
  <text x="690" y="214" font-size="10" fill="#58585e">After Learn</text>

  <line x1="690" y1="224" x2="890" y2="224"
        stroke="#58585e" stroke-width="0.5" stroke-opacity="0.2"/>

  <text x="690" y="244" font-size="10" fill="#b8b8be">Review synthesized observations.</text>
  <text x="690" y="260" font-size="10" fill="#b8b8be">Codify conventions. Break patterns.</text>
  <text x="690" y="276" font-size="10" fill="#b8b8be">Structural actions, not behavioral.</text>

  <text x="690" y="294" font-size="9" fill="#58585e" font-style="italic">
    Replaces: retrospective</text>

  <!-- ═══ BOTTOM NOTE ═══ -->
  <text x="460" y="316" text-anchor="middle"
        font-size="10" fill="#58585e">Event-driven, not calendar-driven. Triggered by phase transitions, not by Tuesdays and Thursdays.</text>
</svg>
