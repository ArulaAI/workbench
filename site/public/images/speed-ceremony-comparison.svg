<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" fill="none">
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  </style>

  <!-- ═══ HEADER ═══ -->
  <text x="460" y="28" text-anchor="middle"
        font-size="11" fill="#a0a0a8" letter-spacing="0.06em" font-weight="600">CEREMONY HOURS PER CYCLE</text>

  <!-- ═══ AGILE BAR ═══ -->
  <text x="20" y="82" font-size="13" fill="#a0a0a8" font-weight="600"
        letter-spacing="0.04em">AGILE</text>
  <text x="20" y="98" font-size="10" fill="#58585e">2-week sprint</text>

  <!-- Sprint Planning: 3h = 66px -->
  <rect x="110" y="68" width="66" height="40" rx="4"
        fill="#8b7355" fill-opacity="0.8"/>
  <text x="143" y="84" text-anchor="middle"
        font-size="7.5" fill="#f0f0f0" font-weight="600">PLANNING</text>
  <text x="143" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">3h</text>

  <!-- Standup: 2h = 44px -->
  <rect x="176" y="68" width="44" height="40" rx="4"
        fill="#7a6b5e" fill-opacity="0.8"/>
  <text x="198" y="84" text-anchor="middle"
        font-size="7" fill="#f0f0f0" font-weight="600">STANDUP</text>
  <text x="198" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">2h</text>

  <!-- Grooming: 1.5h = 33px -->
  <rect x="220" y="68" width="33" height="40" rx="4"
        fill="#6d6058" fill-opacity="0.8"/>
  <text x="237" y="84" text-anchor="middle"
        font-size="6.5" fill="#f0f0f0" font-weight="600">GROOM</text>
  <text x="237" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">1.5h</text>

  <!-- Demo: 1.5h = 33px -->
  <rect x="253" y="68" width="33" height="40" rx="4"
        fill="#605550" fill-opacity="0.8"/>
  <text x="270" y="84" text-anchor="middle"
        font-size="7" fill="#f0f0f0" font-weight="600">DEMO</text>
  <text x="270" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">1.5h</text>

  <!-- Retro: 1.25h = 28px -->
  <rect x="286" y="68" width="28" height="40" rx="4"
        fill="#544a45" fill-opacity="0.8"/>
  <text x="300" y="84" text-anchor="middle"
        font-size="6.5" fill="#f0f0f0" font-weight="600">RETRO</text>
  <text x="300" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">1.3h</text>

  <!-- Code Review: 7.5h = 165px -->
  <rect x="314" y="68" width="165" height="40" rx="4"
        fill="#8b5e5e" fill-opacity="0.8"/>
  <text x="397" y="84" text-anchor="middle"
        font-size="8.5" fill="#f0f0f0" font-weight="600">PR CODE REVIEW</text>
  <text x="397" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#f0f0f0" fill-opacity="0.7">7.5h</text>

  <!-- +7 Supporting Rituals: 7.5h = 165px (dashed outline = "hidden" cost) -->
  <rect x="479" y="68" width="165" height="40" rx="4"
        fill="#8b7355" fill-opacity="0.1"
        stroke="#a0a0a8" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
  <text x="562" y="84" text-anchor="middle"
        font-size="8" fill="#a0a0a8" font-weight="600">+7 MORE</text>
  <text x="562" y="98" text-anchor="middle"
        class="mono" font-size="8" fill="#a0a0a8" fill-opacity="0.7">7.5h</text>

  <!-- Agile total -->
  <text x="660" y="80" font-size="11" fill="#a0a0a8" font-weight="600">~</text>
  <text x="672" y="80"
        class="mono" font-size="18" font-weight="700" fill="#e8a87c">24h</text>
  <text x="714" y="80" font-size="10" fill="#58585e">/sprint</text>
  <text x="672" y="96" font-size="9" fill="#58585e">range: 16-32h</text>

  <!-- ═══ SPEED BAR ═══ -->
  <text x="20" y="182" font-size="13" fill="#a0a0a8" font-weight="600"
        letter-spacing="0.04em">SPEED</text>
  <text x="20" y="198" font-size="10" fill="#58585e">per feature</text>

  <!-- Spec Session: 1.5h = 33px -->
  <rect x="110" y="168" width="33" height="40" rx="4"
        fill="#00ccaa" fill-opacity="0.7"/>
  <text x="127" y="184" text-anchor="middle"
        font-size="7" fill="#303034" font-weight="700">SPEC</text>
  <text x="127" y="198" text-anchor="middle"
        class="mono" font-size="8" fill="#303034" font-weight="600">1.5h</text>

  <!-- Outcome Review: 1.5h = 33px -->
  <rect x="143" y="168" width="33" height="40" rx="4"
        fill="#00ccaa" fill-opacity="0.55"/>
  <text x="160" y="184" text-anchor="middle"
        font-size="7" fill="#303034" font-weight="700">REVIEW</text>
  <text x="160" y="198" text-anchor="middle"
        class="mono" font-size="8" fill="#303034" font-weight="600">1.5h</text>

  <!-- Learning Curation: 1h = 22px -->
  <rect x="176" y="168" width="22" height="40" rx="4"
        fill="#00ccaa" fill-opacity="0.4"/>
  <text x="187" y="184" text-anchor="middle"
        font-size="6" fill="#e0e0e0" font-weight="700">LEARN</text>
  <text x="187" y="198" text-anchor="middle"
        class="mono" font-size="7" fill="#e0e0e0" font-weight="600">1h</text>

  <!-- SPEED total -->
  <text x="216" y="180" font-size="11" fill="#a0a0a8" font-weight="600">~</text>
  <text x="228" y="180"
        class="mono" font-size="18" font-weight="700" fill="#00ccaa">4h</text>
  <text x="258" y="180" font-size="10" fill="#58585e">/feature</text>
  <text x="228" y="196" font-size="9" fill="#58585e">range: 3-5h</text>

  <!-- ═══ SAVED AREA ANNOTATION ═══ -->
  <rect x="198" y="168" width="446" height="40" rx="4"
        fill="none" stroke="#00ccaa" stroke-width="1"
        stroke-dasharray="4,4" stroke-opacity="0.2"/>

  <!-- Delta annotation -->
  <line x1="644" y1="108" x2="644" y2="168"
        stroke="#58585e" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="420" y="148" text-anchor="middle"
        class="mono" font-size="12" fill="#00ccaa" fill-opacity="0.5" font-weight="600">
    ~20h saved per cycle</text>

  <!-- ═══ FOOTER ═══ -->
  <line x1="110" y1="228" x2="800" y2="228"
        stroke="#58585e" stroke-width="0.5" stroke-opacity="0.2"/>

  <text x="110" y="252" font-size="9.5" fill="#58585e">+7: estimation · design review · QA handoff · bug triage · release planning · cross-team sync · stakeholder update</text>
  <text x="110" y="272" font-size="10" fill="#58585e">While humans spend 4h on ceremonies, the system runs</text>
  <text x="110" y="288" font-size="10" fill="#80f0d8" fill-opacity="0.7">validate · plan · verify · run · review · coherence · integrate</text>
</svg>
